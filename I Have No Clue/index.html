<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>I Have No Clue — Colossus</title><style>*{box-sizing:border-box}body{margin:0;background:#101819;color:#eee;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}header{position:absolute;top:24px;left:24px;pointer-events:none}h1{font-size:28px;letter-spacing:.15em;margin:0}small{color:#bbc9bc}nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;max-width:96vw;flex-wrap:wrap;justify-content:center}button{background:#1b2724df;border:1px solid #718477;color:white;padding:13px;border-radius:8px;cursor:pointer}#status{margin-top:10px;color:#d4b77f}#error{position:absolute;top:45%;padding:24px}a{color:inherit}</style><header><small>I HAVE NO CLUE / PROCEDURAL WEBGL PROTOTYPE</small><h1>COLOSSUS</h1><div id="status">A forest beneath his fists.</div><p>Drag to orbit · Scroll or pinch to zoom</p></header><nav><button id="auto">Auto rampage: ON</button><button data-act="trees">Uproot grove</button><button data-act="rock">Hurl boulder</button><button data-act="smash">Ground smash</button><button data-act="chest">Beat chest</button><button id="pause">Pause</button><button id="reset">Restore forest</button></nav><div id="error" role="alert"></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=s=>document.querySelector(s);
let renderer;
try{renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}catch(e){$('#error').textContent='This scene needs a browser with WebGL enabled.';throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x748880);scene.fog=new T.FogExp2(0x748880,.0045);
const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.2,1200);
scene.add(new T.HemisphereLight(0xc9dbe2,0x30321a,2));
const sun=new T.DirectionalLight(0xffe2aa,4);sun.position.set(-70,140,70);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-110,right:110,top:110,bottom:-110,far:400});sun.shadow.bias=-.0005;scene.add(sun);
const mat=(c,r=1)=>new T.MeshStandardMaterial({color:c,roughness:r});
const fur=mat(0x24241f), dark=mat(0x343934),skin=mat(0x151a18,.83),mouthmat=mat(0x300b0b),tooth=mat(0xd6c5a0),bark=mat(0x51432d),stone=mat(0x73786c),leaf=mat(0x293d23);
const ground=new T.Mesh(new T.PlaneGeometry(1400,1400,40,40),mat(0x3a4730));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function ell(parent,m,x,y,z,sx,sy,sz){const o=new T.Mesh(new T.SphereGeometry(1,24,16),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=o.receiveShadow=true;parent.add(o);return o}
const g=new T.Group();scene.add(g);
ell(g,fur,0,24,0,12,16,7);ell(g,dark,0,26,5,9,10,3);
ell(g,fur,0,14,-1,8,7,6);
for(const side of [-1,1]){ell(g,fur,side*6,7,0,4,8,4);ell(g,skin,side*6,1.5,3,4,2,6)}
const arms=[];
for(const s of [-1,1]){const pivot=new T.Group();pivot.position.set(s*11,33,0);g.add(pivot);ell(pivot,fur,s*2,-6,0,5.5,9,5);ell(pivot,fur,s*3,-17,1,4,8,4);ell(pivot,skin,s*3,-24,2,4.8,4,3.8);for(let i=0;i<4;i++)ell(pivot,skin,s*3+(i-1.5)*1.6,-26,4,1,2.4,1.2);arms.push(pivot)}
const head=new T.Group();head.position.set(0,40,1);g.add(head);
ell(head,fur,0,2,0,7,9,6);ell(head,skin,0,0,4,5.7,6,3);
ell(head,skin,0,1,7,3.8,2,1.8);for(const s of [-1,1]){ell(head,skin,s*2.8,3,6,3,1.6,2);ell(head,mat(0x9f7629,.3),s*2.3,2.6,7.6,.6,.45,.3);ell(head,skin,s*2.3,2.6,7.85,.24,.3,.1);ell(head,skin,s*.9,.6,8.6,.55,.35,.25)}
const jaw=new T.Group();jaw.position.set(0,-2,6.5);head.add(jaw);ell(jaw,mouthmat,0,-1,0,3.3,2.8,1.1);ell(jaw,skin,0,-3,.1,3.8,1.4,1.5);
for(const s of [-1,1]){const fang=new T.Mesh(new T.ConeGeometry(.55,2.3,12),tooth);fang.rotation.z=Math.PI;fang.position.set(s*2,-.3,1);jaw.add(fang)}
// Fine strands follow the volume of the torso and head.
const positions=[];for(let i=0;i<11000;i++){const a=Math.random()*Math.PI*2,u=Math.random()*2-1,v=Math.sqrt(1-u*u),x=12*v*Math.cos(a),y=24+16*u,z=7*v*Math.sin(a);positions.push(x,y,z,x+x*.022,y-1-Math.random(),z+z*.025)}
const hairGeo=new T.BufferGeometry();hairGeo.setAttribute('position',new T.Float32BufferAttribute(positions,3));g.add(new T.LineSegments(hairGeo,new T.LineBasicMaterial({color:0x45463c,transparent:true,opacity:.48})));
let trees=[],rocks=[],flying=[],dust=[],auto=true,paused=false,time=0,action=null,shake=0,orbit=.45,elev=.24,distance=145;
function tree(x,z,h=16){const group=new T.Group();group.position.set(x,0,z);const trunk=new T.Mesh(new T.CylinderGeometry(.4,.85,h,7),bark);trunk.position.y=h/2;trunk.castShadow=true;group.add(trunk);for(let i=0;i<3;i++){const crown=new T.Mesh(new T.ConeGeometry(h*(.23-i*.035),h*.5,9),leaf);crown.position.y=h*(.55+i*.16);crown.castShadow=true;group.add(crown)}scene.add(group);trees.push(group);return group}
function populate(){for(let i=0;i<180;i++){const a=Math.random()*6.28,r=25+Math.random()*190;tree(Math.cos(a)*r,Math.sin(a)*r,13+Math.random()*3.3)}for(let i=0;i<24;i++){const r=new T.Mesh(new T.DodecahedronGeometry(1,1),stone);r.scale.set(2+Math.random()*3,2+Math.random()*2,2+Math.random()*3);r.position.set((Math.random()-.5)*140,2,(Math.random()-.5)*140);r.castShadow=true;scene.add(r);rocks.push(r)}}
populate();
function burst(x,z,n=40){for(let i=0;i<n;i++){const o=new T.Mesh(new T.IcosahedronGeometry(.3+Math.random()*.9),Math.random()>.5?stone:bark);o.position.set(x,1,z);scene.add(o);dust.push({o,v:new T.Vector3((Math.random()-.5)*22,4+Math.random()*16,(Math.random()-.5)*22),life:2+Math.random()*2})}shake=1}
function choose(kind){if(action)return;action={kind,t:0,items:[],released:false};$('#status').textContent=({trees:'Roots tear. A grove comes free.',rock:'Stone lifted from the earth.',smash:'The ground takes the blow.',chest:'The valley hears him.'})[kind];
if(kind==='trees'){const nearest=trees.slice().sort((a,b)=>a.position.lengthSq()-b.position.lengthSq()).slice(0,5);action.items=nearest;trees=trees.filter(t=>!nearest.includes(t))}
if(kind==='rock'){const r=rocks.shift();if(r)action.items=[r]}}
function release(){for(const o of action.items){flying.push({o,v:new T.Vector3(25+Math.random()*20,30+Math.random()*12,-30-Math.random()*30),spin:new T.Vector3(Math.random()*2,Math.random(),Math.random()*3),life:9})}action.released=true}
let next=1;
const clock=new T.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.035);if(!paused){time+=dt;if(auto&&!action&&time>next)choose(['trees','rock','smash','chest'][Math.floor(Math.random()*4)]);
g.rotation.y=Math.sin(time*.14)*.13;g.position.y=Math.sin(time*2)*.2;head.rotation.x=.06;head.rotation.y=Math.sin(time*.6)*.13;jaw.scale.y=1;arms.forEach((a,i)=>{a.rotation.x=Math.sin(time*1.6+i)*.035;a.rotation.z=(i===0?.08:-.08)});
if(action){action.t+=dt;const t=action.t,k=action.kind;head.rotation.x=-.14;jaw.scale.y=1+Math.sin(Math.min(t,1)*Math.PI/2)*.65;
if(k==='chest'){arms.forEach((a,i)=>{a.rotation.z=(i===0?-1:1)*.55;a.rotation.x=-1.1+Math.sin(t*15+i*Math.PI)*.35});if(Math.sin(t*15)>.95)shake=.3}
else{let lift=t<1.4?t/1.4:t<2?1:Math.max(0,1-(t-2)*3);arms.forEach((a,i)=>{a.rotation.x=-lift*2.5;a.rotation.z=(i===0?-1:1)*lift*.15});
if(!action.released){for(let i=0;i<action.items.length;i++){const o=action.items[i];o.position.lerp(new T.Vector3((i-2)*3,3+lift*43,12),Math.min(1,dt*8));o.rotation.z=lift*.5}if(t>2){release();burst(0,14)}}}
if(t>3.5){action=null;next=time+.8+Math.random()*1.5}}
for(let i=flying.length-1;i>=0;i--){const p=flying[i];p.v.y-=20*dt;p.o.position.addScaledVector(p.v,dt);p.o.rotation.x+=p.spin.x*dt;p.o.rotation.z+=p.spin.z*dt;p.life-=dt;if(p.o.position.y<0||p.life<0){burst(p.o.position.x,p.o.position.z,15);p.o.position.y=0;flying.splice(i,1)}}
for(let i=dust.length-1;i>=0;i--){const p=dust[i];p.life-=dt;p.v.y-=22*dt;p.o.position.addScaledVector(p.v,dt);p.o.rotation.x+=dt*4;if(p.life<0||p.o.position.y<0){scene.remove(p.o);p.o.geometry.dispose();dust.splice(i,1)}}
shake*=.9}
camera.position.set(Math.sin(orbit)*distance,27+Math.sin(elev)*distance,Math.cos(orbit)*distance);camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;camera.lookAt(0,24,0);renderer.render(scene,camera)}
frame();
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>choose(b.dataset.act));
$('#auto').onclick=()=>{$('#auto').textContent='Auto rampage: '+((auto=!auto)?'ON':'OFF')};
$('#pause').onclick=()=>{$('#pause').textContent=(paused=!paused)?'Resume':'Pause'};
$('#reset').onclick=()=>{for(const o of [...trees,...rocks,...flying.map(p=>p.o),...(action?.items||[])])scene.remove(o);trees=[];rocks=[];flying=[];action=null;populate()};
const pointers=new Map();let pinch=0;renderer.domElement.onpointerdown=e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture(e.pointerId)};
renderer.domElement.onpointermove=e=>{const p=pointers.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){orbit-=dx*.006;elev=T.MathUtils.clamp(elev+dy*.004,-.08,.9)}else{const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)distance=T.MathUtils.clamp(distance+pinch-d,65,320);pinch=d}};
for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=0});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();distance=T.MathUtils.clamp(distance+e.deltaY*.1,65,320)},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){paused=true;$('#pause').textContent='Resume'}});
</script></html>
