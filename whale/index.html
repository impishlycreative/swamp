<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Whale — Wireframe Ocean</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050a;color:#dffcff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{touch-action:none}main,canvas{width:100%;height:100%}main{position:relative;min-height:360px;background:radial-gradient(circle at 50% 35%,rgba(0,80,110,.12),transparent 40%),#01050a}canvas{display:block}#hud{position:absolute;inset:16px 16px auto;display:grid;grid-template-columns:minmax(150px,260px) auto auto;gap:10px;pointer-events:none;text-shadow:0 0 10px #3be7ff}.card{border:1px solid #4edfff66;background:#00101a80;padding:8px 11px;backdrop-filter:blur(4px)}.label,.score{font-size:12px;letter-spacing:.18em;font-weight:800}.bar{margin-top:6px;height:9px;border:1px solid #dffcff88;padding:1px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#21e8ff,#62ff8b 42%,#ffe45c 72%,#ff4878);box-shadow:0 0 12px #38eaff}.score{justify-self:end}.score b,.speed b{font-size:19px}.speed{justify-self:end}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle,rgba(2,20,30,.55),rgba(0,0,0,.94));z-index:5}.panel{width:min(640px,100%);border:1px solid #58e5ff77;background:#000a12e8;padding:clamp(22px,4vw,42px);box-shadow:0 0 55px #009dff22}.eyebrow{margin:0 0 8px;color:#6feaff;font-size:12px;font-weight:800;letter-spacing:.22em}h1,h2{margin:0;letter-spacing:.16em}h1{font-size:clamp(42px,9vw,92px);line-height:.95}.panel p{color:#b8dfe7;line-height:1.5}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 18px;margin:20px 0;color:#9dd6df;font-size:14px}kbd{border:1px solid #6de5ff77;background:#061e2a;padding:2px 6px;color:#eaffff}button{min-height:46px;border:1px solid #72edff;background:#0097cd24;color:#eaffff;padding:10px 18px;font:inherit;font-weight:800;letter-spacing:.12em;cursor:pointer}.hidden{display:none!important}#msg{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font-weight:800;letter-spacing:.12em;text-shadow:0 0 12px currentColor;opacity:0;transition:opacity .2s;pointer-events:none}#msg.on{opacity:1}#err{position:absolute;left:12px;right:12px;bottom:12px;padding:12px;border:1px solid #ff6a73;background:#30000aee;z-index:20}.reticle{position:absolute;left:50%;top:53%;width:26px;height:26px;transform:translate(-50%,-50%);border:1px solid #8aeaff55;border-radius:50%;pointer-events:none}@media(max-width:640px){#hud{grid-template-columns:1fr auto;inset:8px 8px auto}.speed,.reticle{display:none}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<canvas id="game" tabindex="0" aria-label="3D wireframe humpback whale game"></canvas>
<section id="hud"><div class="card"><div class="label">ENERGY</div><div class="bar"><div id="energy" class="fill"></div></div></div><div class="card score">KRILL <b id="krill">0</b></div><div class="card speed"><div class="label">SPEED</div><b><span id="speed">0</span> kn</b></div></section>
<div class="reticle" aria-hidden="true"></div>
<section id="intro" class="overlay"><div class="panel"><p class="eyebrow">WIREFRAME OCEAN</p><h1>WHALE</h1><p>Swim a living wireframe humpback through a neon ocean. Feed on krill, ride currents, thread the canyon, and avoid the wreck.</p><div class="controls"><span><kbd>W</kbd>/<kbd>↑</kbd> rise</span><span><kbd>S</kbd>/<kbd>↓</kbd> dive</span><span><kbd>A</kbd>/<kbd>←</kbd> left</span><span><kbd>D</kbd>/<kbd>→</kbd> right</span><span><kbd>Shift</kbd> accelerate</span><span><kbd>Space</kbd> lunge</span></div><button id="start">ENTER THE WATER</button></div></section>
<section id="over" class="overlay hidden"><div class="panel"><p class="eyebrow">ENERGY DEPLETED</p><h2>THE OCEAN WON</h2><p>You collected <b id="final">0</b> krill.</p><button id="again">SWIM AGAIN</button></div></section>
<div id="msg" role="status" aria-live="polite"></div><div id="err" class="hidden" role="alert"></div>
</main>
<script type="module">
let THREE;const err=document.querySelector('#err');try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js')}catch(e){err.textContent='Unable to load the 3D engine. Check the network connection.';err.classList.remove('hidden');throw e}
if(!window.WebGL2RenderingContext){err.textContent='WebGL 2 is required. Use a current Firefox, Chrome, or Edge with hardware acceleration enabled.';err.classList.remove('hidden');throw Error('WebGL2 unavailable')}
const c=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas:c,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0x01050a);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color(0x01050a);scene.fog=new THREE.FogExp2(0x01060c,.0105);const camera=new THREE.PerspectiveCamera(64,1,.1,700),clock=new THREE.Clock(),keys=new Set(),materials=[];const F=new THREE.Vector3(0,0,-1),UP=new THREE.Vector3(0,1,0),v=new THREE.Vector3(),v2=new THREE.Vector3();let playing=false,energy=100,krill=0,t=0,msgT=0;
function mat(h=.52,o=.9){const m=new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(h,1,.62),wireframe:true,transparent:true,opacity:o,depthWrite:false,blending:THREE.AdditiveBlending});m.userData.h=h;materials.push(m);return m}function wire(g,h,o){return new THREE.Mesh(g,mat(h,o))}function line(points,h=.55,o=.5){const g=new THREE.BufferGeometry().setFromPoints(points),m=new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(h,1,.62),transparent:true,opacity:o,blending:THREE.AdditiveBlending});return new THREE.LineSegments(g,m)}
function floorH(x,z){return -19+Math.sin(z*.025)*3+Math.sin(x*.11+z*.008)*2.2+Math.cos(z*.055+x*.05)*1.3}
function terrain(){const g=new THREE.PlaneGeometry(110,760,34,150);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i)-340;let y=floorH(x,z);const walls=Math.pow(Math.max(0,(Math.abs(x)-27)/28),1.55)*17;y+=walls;p.setXYZ(i,x,y,z)}p.needsUpdate=true;const m=wire(g,.57,.35);scene.add(m);for(let i=0;i<28;i++){const z=-35-i*24,x=(Math.random()>.5?1:-1)*(31+Math.random()*17),r=3+Math.random()*7,rock=wire(new THREE.IcosahedronGeometry(r,1),.52+Math.random()*.22,.42);rock.scale.y=1.3+Math.random()*1.5;rock.position.set(x,floorH(x,z)+r*.4,z);scene.add(rock)}const arch=new THREE.Group();for(const x of [-13,13]){const col=wire(new THREE.CylinderGeometry(2.2,4,28,8,8,true),.62,.5);col.position.set(x,-4,-165);arch.add(col)}const top=wire(new THREE.TorusGeometry(13,2.1,7,20,Math.PI),.62,.5);top.position.set(0,10,-165);top.rotation.z=Math.PI;arch.add(top);scene.add(arch)}
function wreck(){const w=new THREE.Group();w.position.set(20,-12,-330);w.rotation.y=-.55;w.rotation.z=-.12;const hull=wire(new THREE.CylinderGeometry(7,4,42,12,9,true),.01,.72);hull.rotation.x=Math.PI/2;w.add(hull);const deck=wire(new THREE.BoxGeometry(11,3,19,5,2,6),.98,.7);deck.position.set(-.5,5,1);w.add(deck);const breakDeck=wire(new THREE.BoxGeometry(8,3,8,3,2,3),.99,.62);breakDeck.position.set(2,4,15);breakDeck.rotation.z=.2;w.add(breakDeck);for(const [x,z,h] of [[-2,-7,25],[2,12,18]]){const mast=wire(new THREE.CylinderGeometry(.4,.6,h,8,8,true),.03,.65);mast.position.set(x,h/2+5,z);w.add(mast);const rope=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,h+5,z),new THREE.Vector3(x-10,1,z-12),new THREE.Vector3(x,h+5,z),new THREE.Vector3(x+10,1,z+10)]),new THREE.LineBasicMaterial({color:0xff6d59,transparent:true,opacity:.55}));w.add(rope)}for(let i=0;i<7;i++){const rib=wire(new THREE.TorusGeometry(5,.15,5,12,Math.PI),.02+i*.01,.55);rib.rotation.z=Math.PI/2;rib.position.set(0,-1.8,-5+i*3.4);w.add(rib)}for(let i=0;i<9;i++){const d=wire(new THREE.BoxGeometry(1+Math.random()*2,.6,3+Math.random()*7),.04+Math.random()*.08,.45);d.position.set((Math.random()-.5)*30,-3+Math.random()*4,15+Math.random()*32);d.rotation.set(Math.random(),Math.random(),Math.random());w.add(d)}scene.add(w);return w}
function whale(){const root=new THREE.Group();root.position.set(0,-1,18);const body=wire(new THREE.SphereGeometry(1,14,11),.52,.95);body.scale.set(2.25,1.35,5.1);root.add(body);const head=wire(new THREE.SphereGeometry(1,13,10),.58,.95);head.scale.set(2.55,1.2,2.55);head.position.z=-4.05;root.add(head);const nose=wire(new THREE.SphereGeometry(1,11,8),.62,.9);nose.scale.set(2.15,.62,1.45);nose.position.set(0,-.12,-5.65);root.add(nose);const rear=new THREE.Group();rear.position.z=4.3;root.add(rear);const p1=wire(new THREE.SphereGeometry(1,10,8),.48,.9);p1.scale.set(1.25,.78,2.3);p1.position.z=1.25;rear.add(p1);const tail=new THREE.Group();tail.position.z=2.9;rear.add(tail);const p2=wire(new THREE.SphereGeometry(1,9,7),.45,.9);p2.scale.set(.78,.52,1.8);p2.position.z=1.1;tail.add(p2);const fluke=new THREE.Group();fluke.position.z=2.45;tail.add(fluke);for(const s of [-1,1]){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([0,0,0,s*2.2,.05,.35,s*4.1,0,1.2,s*3.3,0,2,s*.5,0,1.25]),3));geo.setIndex([0,1,4,1,2,3,1,3,4]);fluke.add(wire(geo,s<0?.66:.74,.98))}const fins=[];for(const s of [-1,1]){const pivot=new THREE.Group(),geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([s*1.4,-.15,-1.8,s*2.6,-.3,-.5,s*6.1,-.7,2.8,s*5.1,-.45,4.3,s*2,-.15,2]),3));geo.setIndex([0,1,4,1,2,3,1,3,4]);pivot.add(wire(geo,s<0?.81:.12,.95));root.add(pivot);fins.push(pivot)}for(let i=-5;i<=5;i++)root.add(line([new THREE.Vector3(i*.28,-.85,-5.45),new THREE.Vector3(i*.33,-1.08,-3.6),new THREE.Vector3(i*.28,-1.18,-1.7)],.56+i*.005,.34));scene.add(root);return{root,rear,tail,fluke,left:fins[0],right:fins[1]}}
function particles(){const n=1700,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=(Math.random()-.5)*150;a[i*3+1]=-20+Math.random()*65;a[i*3+2]=50-Math.random()*760}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x65dfff,size:.11,transparent:true,opacity:.35,depthWrite:false,blending:THREE.AdditiveBlending})))}
function school(x,y,z,seed){const n=150,a=new Float32Array(n*3);for(let i=0;i<n;i++){const q=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.45)*5.2;a[i*3]=Math.cos(q)*r;a[i*3+1]=(Math.random()-.5)*4.5;a[i*3+2]=Math.sin(q)*r*1.6}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:new THREE.Color().setHSL(.02+seed*.07,1,.65),size:.22,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending}));p.position.set(x,y,z);p.userData.baseY=y;p.userData.seed=seed;p.userData.value=120+Math.floor(Math.random()*80);scene.add(p);return p}
function current(x,y,z,s,h){const g=new THREE.Group();g.position.set(x,y,z);g.userData.r=8*s;for(let i=0;i<5;i++){const r=wire(new THREE.TorusGeometry((5+i*1.4)*s,.09,5,42),h+i*.025,.26);r.rotation.y=Math.PI/2;r.position.z=i*1.7;g.add(r)}scene.add(g);return g}
terrain();particles();const wreckObj=wreck(),W=whale(),schools=[school(-8,-2,-82,1),school(12,-5,-142,2),school(-5,-8,-250,3),school(24,-4,-310,4),school(-15,-9,-390,5),school(8,-5,-545,6)],currents=[current(-10,-4,-205,1,.53),current(12,-10,-505,1.25,.61)];const S={yaw:0,pitch:0,roll:0,speed:10,target:10,lunge:0};
function say(x){const m=document.querySelector('#msg');m.textContent=x;m.classList.add('on');msgT=1.5}function hud(){document.querySelector('#energy').style.width=Math.max(0,energy)+'%';document.querySelector('#krill').textContent=krill.toLocaleString();document.querySelector('#speed').textContent=Math.round(S.speed*1.7)}function respawn(s){s.position.z=W.root.position.z-230-Math.random()*330;s.position.x=(Math.random()-.5)*45;s.userData.baseY=floorH(s.position.x,s.position.z)+8+Math.random()*16;s.position.y=s.userData.baseY}
function reset(){energy=100;krill=0;t=0;S.yaw=S.pitch=S.roll=S.lunge=0;S.speed=S.target=10;W.root.position.set(0,-1,18);W.root.rotation.set(0,0,0);[-82,-142,-250,-310,-390,-545].forEach((z,i)=>schools[i].position.z=z);document.querySelector('#over').classList.add('hidden');hud()}
function start(){reset();document.querySelector('#intro').classList.add('hidden');playing=true;clock.getDelta();c.focus()}document.querySelector('#start').addEventListener('click',start);document.querySelector('#again').addEventListener('click',start);addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Escape')playing=!playing});addEventListener('keyup',e=>keys.delete(e.code));
function animateWhale(dt){const beat=1.45+S.speed*.055,amp=.18+Math.min(1,S.speed/18)*.18,a=Math.sin(t*beat*Math.PI*2);W.rear.rotation.x=a*amp*.45;W.tail.rotation.x=Math.sin(t*beat*Math.PI*2-.55)*amp;W.fluke.rotation.x=Math.sin(t*beat*Math.PI*2-1)*amp*1.1;W.left.rotation.z=.05+Math.sin(t*.8)*.05-S.roll*.28;W.right.rotation.z=-.05-Math.sin(t*.8)*.05-S.roll*.28;W.left.rotation.x=S.pitch*.25;W.right.rotation.x=S.pitch*.25}
function step(dt){t+=dt;const left=keys.has('KeyA')||keys.has('ArrowLeft'),right=keys.has('KeyD')||keys.has('ArrowRight'),up=keys.has('KeyW')||keys.has('ArrowUp'),down=keys.has('KeyS')||keys.has('ArrowDown'),boost=keys.has('ShiftLeft')||keys.has('ShiftRight'),slow=keys.has('ControlLeft')||keys.has('ControlRight');const turn=(left?1:0)-(right?1:0),pitch=(up?1:0)-(down?1:0);S.target=slow?6:boost?18:10;if(keys.has('Space')&&S.lunge<=0&&energy>6){S.lunge=.75;energy-=4;say('LUNGE')}S.lunge=Math.max(0,S.lunge-dt);const goal=S.target+(S.lunge>0?10:0);S.speed+=((goal-S.speed)*Math.min(1,dt*1.8));S.yaw+=turn*dt*(.38+.16*S.speed/18);S.pitch+=pitch*dt*.35;S.pitch*=Math.pow(.88,dt*10);S.pitch=Math.max(-.45,Math.min(.45,S.pitch));S.roll+=((-turn*.38)-S.roll)*Math.min(1,dt*3);W.root.rotation.set(S.pitch,S.yaw,S.roll,'YXZ');v.copy(F).applyQuaternion(W.root.quaternion).normalize();W.root.position.addScaledVector(v,S.speed*dt);for(const cur of currents){cur.rotation.z+=dt*.5;const d=W.root.position.distanceTo(cur.position);if(d<cur.userData.r){W.root.position.x+=Math.sin(t*2+cur.position.z)*dt*2.2;W.root.position.y+=Math.cos(t*1.5)*dt*.8}}const floor=floorH(W.root.position.x,W.root.position.z);if(W.root.position.y<floor+3){W.root.position.y=floor+3;energy-=dt*14;say('SEAFLOOR COLLISION')}if(Math.abs(W.root.position.x)>48){energy-=dt*10;W.root.position.x*=.995;say('CANYON WALL')}if(W.root.position.distanceTo(wreckObj.position)<12){energy-=dt*18;say('WRECK COLLISION')}energy-=dt*(.5+(boost?1.1:0));for(const s of schools){s.position.y=s.userData.baseY+Math.sin(t*1.7+s.userData.seed)*1.1;s.rotation.y+=dt*.2;if(W.root.position.distanceTo(s.position)<7){krill+=s.userData.value;energy=Math.min(100,energy+11);say('FEEDING +'+s.userData.value);respawn(s)}else if(s.position.z>W.root.position.z+80)respawn(s)}if(W.root.position.z<-650)W.root.position.z=25;animateWhale(dt);hud();if(energy<=0){energy=0;playing=false;document.querySelector('#final').textContent=krill.toLocaleString();document.querySelector('#over').classList.remove('hidden')}}
function cam(dt){v.copy(F).applyQuaternion(W.root.quaternion);v2.set(0,5.7,13.5).applyQuaternion(W.root.quaternion).add(W.root.position);camera.position.lerp(v2,1-Math.pow(.002,dt));const look=W.root.position.clone().addScaledVector(v,15).add(new THREE.Vector3(0,1.2,0));camera.lookAt(look)}function resize(){const w=c.clientWidth,h=c.clientHeight,d=renderer.getPixelRatio();if(c.width!==Math.floor(w*d)||c.height!==Math.floor(h*d)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}
function loop(){requestAnimationFrame(loop);const dt=Math.min(.033,clock.getDelta());resize();if(playing)step(dt);else animateWhale(dt);cam(dt);materials.forEach((m,i)=>m.color.setHSL((m.userData.h+t*.025+i*.003)%1,1,.62));if(msgT>0&&(msgT-=dt)<=0)document.querySelector('#msg').classList.remove('on');renderer.render(scene,camera)}hud();cam(.016);loop();
</script>
</body>
</html>
