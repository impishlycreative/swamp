<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <title>Wolf — WebGL Werewolf</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
    body{min-height:100dvh}
    #stage{position:fixed;inset:0;background:#05070a}
    #base,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
    #base{object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none}
    #fx{pointer-events:none}
    #status{position:fixed;left:10px;bottom:10px;z-index:5;padding:6px 8px;border-radius:7px;background:rgba(0,0,0,.35);color:rgba(220,230,238,.62);font:10px/1.2 system-ui,sans-serif}
  </style>
</head>
<body>
  <div id="stage">
    <img id="base" alt="Moonlit werewolf" />
    <canvas id="fx" aria-hidden="true"></canvas>
  </div>
  <div id="status">Static artwork · rolling WebGL fog, clouds and spittle</div>

  <script>
  (async()=>{
    const img=document.getElementById('base');
    const canvas=document.getElementById('fx');
    const status=document.getElementById('status');

    const chunks=Array.from({length:6},(_,i)=>`./assets/werewolf-${String(i).padStart(2,'0')}.txt`);
    const encoded=(await Promise.all(chunks.map(async url=>{
      const r=await fetch(url,{cache:'force-cache'});
      if(!r.ok) throw new Error(`Failed ${url}`);
      return r.text();
    }))).join('');

    img.src=`data:image/webp;base64,${encoded}`;
    await img.decode();

    const gl=canvas.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:false});
    if(!gl){status.textContent='WebGL 2 unavailable';return;}

    const vs=`#version 300 es
      precision highp float;
      out vec2 vUv;
      const vec2 P[3]=vec2[](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
      void main(){
        vec2 p=P[gl_VertexID];
        vUv=p*.5+.5;
        gl_Position=vec4(p,0.,1.);
      }`;

    const fs=`#version 300 es
      precision highp float;
      in vec2 vUv;
      out vec4 outColor;
      uniform vec2 uResolution;
      uniform vec2 uImageOffset;
      uniform vec2 uImageSize;
      uniform float uTime;

      float hash(vec2 p){
        p=fract(p*vec2(123.34,456.21));
        p+=dot(p,p+45.32);
        return fract(p.x*p.y);
      }

      float noise(vec2 p){
        vec2 i=floor(p),f=fract(p);
        f=f*f*(3.-2.*f);
        float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));
        return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
      }

      float fbm(vec2 p){
        float v=0.,a=.5;
        for(int i=0;i<5;i++){
          v+=a*noise(p);
          p=mat2(.8,.6,-.6,.8)*p*2.03+7.13;
          a*=.5;
        }
        return v;
      }

      float ell(vec2 p,vec2 c,vec2 s){
        vec2 q=(p-c)/s;
        return 1.-smoothstep(.72,1.,dot(q,q));
      }

      float drop(vec2 p,vec2 c,float s,float stretch){
        vec2 q=(p-c)/vec2(s,s*stretch);
        float body=1.-smoothstep(.28,1.,dot(q,q));
        float glint=1.-smoothstep(.03,.20,length(q-vec2(-.18,.25)));
        return body*(.58+.42*glint);
      }

      void main(){
        vec2 px=vUv*uResolution;
        vec2 uv=(px-uImageOffset)/uImageSize;
        if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.){
          outColor=vec4(0.);
          return;
        }

        float t=uTime;
        vec3 rgb=vec3(0.);
        float alpha=0.;

        // Clearly moving cloud banks crossing the upper sky and moon.
        vec2 cp1=vec2(uv.x*3.4-t*.16,uv.y*4.5);
        vec2 cp2=vec2(uv.x*5.1-t*.09,uv.y*6.2+3.4);
        float cn1=fbm(cp1);
        float cn2=fbm(cp2);
        float sky=smoothstep(.56,.72,uv.y);
        float moon=ell(uv,vec2(.83,.82),vec2(.17,.16));
        float clouds=smoothstep(.47,.72,cn1*.70+cn2*.30)*sky;
        float ca=clouds*(.12+.38*moon);
        rgb+=vec3(.16,.18,.22)*ca;
        alpha=max(alpha,ca);
        float ce=(smoothstep(.50,.57,cn1)-smoothstep(.57,.66,cn1))*sky*(.10+.32*moon);
        rgb+=vec3(.30,.33,.37)*ce;
        alpha=max(alpha,ce);

        // Three genuinely independent rolling fog layers.
        // The speeds are intentionally obvious so motion is readable immediately.
        vec2 fp1=vec2(uv.x*2.35-t*.34,uv.y*7.0+sin(t*.42)*.12);
        vec2 fp2=vec2(uv.x*3.70+t*.21,uv.y*10.0+4.6);
        vec2 fp3=vec2(uv.x*5.50-t*.46,uv.y*14.0+9.3);

        float fn1=fbm(fp1+vec2(fbm(fp1*.45),0.));
        float fn2=fbm(fp2+vec2(0.,fbm(fp2*.38)));
        float fn3=fbm(fp3);

        float ground=1.-smoothstep(.16,.54,uv.y);
        float middle=1.-smoothstep(.30,.66,uv.y);
        float nearGround=1.-smoothstep(.08,.36,uv.y);

        float band1=smoothstep(.39,.69,fn1)*ground*.62;
        float band2=smoothstep(.45,.72,fn2)*middle*.44;
        float band3=smoothstep(.50,.75,fn3)*nearGround*.58;

        // Slow vertical billow so it rolls instead of merely sliding.
        float billow=.82+.18*sin(t*1.3+uv.x*9.0+fn1*5.0);
        float fog=clamp((band1+band2+band3)*billow,0.,1.);
        float fogAlpha=fog*.52;
        vec3 fogColor=vec3(.54,.61,.68);
        rgb=mix(rgb,fogColor,fogAlpha);
        alpha=max(alpha,fogAlpha);

        // Independent saliva from the fixed mouth position.
        vec2 mouth=vec2(.616,.785);
        float sx=abs(uv.x-mouth.x);
        float sy=smoothstep(mouth.y-.102,mouth.y-.020,uv.y)*(1.-smoothstep(mouth.y-.007,mouth.y+.010,uv.y));
        float strand=(1.-smoothstep(.0012,.0042,sx))*sy*.58;
        float q1=mod(t*.16+.01,.18);
        float q2=mod(t*.12+.08,.22);
        float q3=mod(t*.19+.13,.27);
        float d1=drop(uv,mouth+vec2(.004,-.028-q1),.0048,2.1);
        float d2=drop(uv,mouth+vec2(-.010,-.043-q2),.0036,1.8);
        float d3=drop(uv,mouth+vec2(.014,-.060-q3),.0029,1.6);
        float saliva=max(strand,max(d1,max(d2,d3)));
        if(saliva>0.){
          rgb=max(rgb,vec3(.88,.94,.98)*saliva);
          alpha=max(alpha,saliva*.92);
        }

        outColor=vec4(rgb,clamp(alpha,0.,.82));
      }`;

    function makeShader(type,src){
      const s=gl.createShader(type);
      gl.shaderSource(s,src);
      gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    const prog=gl.createProgram();
    gl.attachShader(prog,makeShader(gl.VERTEX_SHADER,vs));
    gl.attachShader(prog,makeShader(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

    gl.useProgram(prog);
    gl.bindVertexArray(gl.createVertexArray());
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

    const locRes=gl.getUniformLocation(prog,'uResolution');
    const locOff=gl.getUniformLocation(prog,'uImageOffset');
    const locSize=gl.getUniformLocation(prog,'uImageSize');
    const locTime=gl.getUniformLocation(prog,'uTime');

    function resize(){
      const vv=window.visualViewport;
      const cssW=Math.max(1,Math.round(vv?.width||innerWidth));
      const cssH=Math.max(1,Math.round(vv?.height||innerHeight));
      const dpr=Math.min(devicePixelRatio||1,2);

      canvas.style.width=`${cssW}px`;
      canvas.style.height=`${cssH}px`;
      canvas.width=Math.round(cssW*dpr);
      canvas.height=Math.round(cssH*dpr);
      gl.viewport(0,0,canvas.width,canvas.height);

      // Same contain calculation used by the IMG element.
      const scale=Math.min(cssW/img.naturalWidth,cssH/img.naturalHeight);
      const iw=img.naturalWidth*scale;
      const ih=img.naturalHeight*scale;
      const ox=(cssW-iw)/2;
      const oy=(cssH-ih)/2;

      gl.uniform2f(locRes,cssW,cssH);
      gl.uniform2f(locOff,ox,oy);
      gl.uniform2f(locSize,iw,ih);
    }

    resize();
    addEventListener('resize',resize,{passive:true});
    window.visualViewport?.addEventListener('resize',resize,{passive:true});
    window.visualViewport?.addEventListener('scroll',resize,{passive:true});

    const start=performance.now();
    function frame(now){
      gl.clearColor(0,0,0,0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(prog);
      gl.uniform1f(locTime,(now-start)/1000);
      gl.drawArrays(gl.TRIANGLES,0,3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })().catch(err=>{
    console.error(err);
    document.getElementById('status').textContent='Scene failed to load';
  });
  </script>
</body>
</html>
