renderWorld(){this.updateView();this.g.clear();this.li=0;let s=this.s,g=this.g;g.fillStyle(0x122337);g.fillRect(0,0,this.scale.width,this.scale.height);for(let y=0;y<24;y++)for(let x=0;x<24;x++){let p=this.project(x,y),t=this.tile;if(p[0]+t<0||p[1]+t<0||p[0]>this.scale.width||p[1]>this.scale.height)continue;let road=x>=9&&x<=15||y>=7&&y<=9||y>=14&&y<=16;let c=(road?0xb0c4ce:0xd3e0e5)-(x*13+y*7)%5*0x020201;g.fillStyle(c);g.fillRect(p[0],p[1],t+1,t+1);if(road){g.lineStyle(1,0x899fac,.22);g.strokeRect(p[0]+1,p[1]+1,t-2,t-2)}else{let q=this.project(x+.4,y+.6);this.ellipse(...q,10*s,5*s,0xffffff,.5)}}let tree=this.project(12,11);for(let j=0;j<4;j++){let radius=(39-j*8)*s;this.ellipse(tree[0]+2*s,tree[1]+3*s,radius*2,radius*2,0x243f38,.8);this.ellipse(tree[0],tree[1],radius*2,radius*2,0x315c50+j*0x030400);for(let k=0;k<9;k++){let a=k*Math.PI*2/9+j*.3;this.ellipse(tree[0]+Math.cos(a)*radius*.82,tree[1]+Math.sin(a)*radius*.82,4*s,4*s,[0xffc95c,0xff736c,0x81d5f0][k%3])}}this.ellipse(tree[0],tree[1],10*s,10*s,0xffe6a1);for(let b of buildings)this.drawHouse(b);let q=this.project(this.globe.x,this.globe.y);this.ellipse(q[0]+3*s,q[1]+4*s,51*s,51*s,0x3b5267,.35);this.ellipse(q[0],q[1],49*s,49*s,0x6c4832);this.ellipse(q[0],q[1],44*s,44*s,0xa4e4ff,.8);if(!this.win){this.ellipse(q[0],q[1],19*s,19*s,0xac4346);this.ellipse(q[0],q[1],11*s,11*s,0xffdfbd);this.ellipse(q[0]-12*s,q[1]-12*s,8*s,8*s,0xffffff,.8)}this.label(q[0],q[1]-27*s,this.win?'Spell broken':'Santa’s snow globe',12*s);for(let a of this.pickups)if(!a.done){let q=this.project(a.x,a.y);this.ellipse(q[0],q[1],25*s,25*s,0xffd36d,.35);this.poly([[q[0],q[1]-10*s],[q[0]+8*s,q[1]],[q[0],q[1]+10*s],[q[0]-8*s,q[1]]],0xffdf81)}let cr=this.project(this.crate.x,this.crate.y);g.fillStyle(0x845d42);g.fillRect(cr[0]-10*s,cr[1]-10*s,20*s,20*s);this.line([cr[0]-9*s,cr[1]-9*s],[cr[0]+9*s,cr[1]+9*s],0xb98d59,2*s);let an=this.project(this.anchor.x,this.anchor.y);this.ellipse(...an,20*s,20*s,0x74523d);this.ellipse(...an,12*s,12*s,0xe6c56e);for(let o of [this.p,this.mrs,...this.bears,...this.allies,...this.foes.filter(f=>!f.done)]){let f=o.k!==undefined;this.actor(o,f?kinds[o.k]:o.kind||'Elf',f?[0xa56c55,0x77b8cf,0xaa7346,0xe4edf0,0x805887,0x617654][o.k]:o===this.mrs?0x8a3f3d:o.kind==='Polar bear'?0x597b91:0x386e52);if(f&&o.until>this.t){let q=this.project(o.x,o.y);this.ellipse(q[0],q[1],36*s,36*s,0xa8dfff,.22)}}if(this.effect&&this.effect.end>this.t)this.line(this.project(this.p.x,this.p.y),this.project(this.effect.x,this.effect.y),this.effect.c,3*s);if(this.shield>this.t){let q=this.project(this.p.x,this.p.y);this.ellipse(q[0],q[1],56*s,56*s,0x8ddfff,.22)}for(let a of this.particles){a.life-=.016;a.x+=a.vx*.016;a.y+=a.vy*.016;let q=this.project(a.x,a.y);this.ellipse(q[0],q[1],4*s,4*s,a.c,Math.max(0,a.life))}this.particles=this.particles.filter(a=>a.life>0);for(let a of this.snow){let x=((a.x+this.t*.012*a.z)%1)*this.scale.width,y=((a.y+this.t*.03*a.z)%1)*this.scale.height;this.ellipse(x,y,2*a.z+1,2*a.z+1,0xf0f9ff,.5)}for(let i=this.li;i<this.labels.length;i++)this.labels[i].setVisible(false);}
