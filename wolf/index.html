<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <title>Wolf — WebGL Werewolf</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070a}
    body{min-height:100dvh}
    canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;background:#05070a;touch-action:none}
    .fallback{display:none;position:fixed;inset:0;place-items:center;padding:24px;color:#e8edf2;background:#05070a;text-align:center;font-family:system-ui,sans-serif}
    .fallback strong{display:block;margin-bottom:8px}
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Animated moonlit werewolf scene"></canvas>
  <div class="fallback" id="fallback"><div><strong>WebGL is unavailable.</strong>This scene needs WebGL enabled.</div></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const canvas = document.getElementById('scene');
    const fallback = document.getElementById('fallback');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
    } catch (err) {
      fallback.style.display='grid';
      throw err;
    }
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

    const chunkUrls = Array.from({length:6},(_,i)=>`./assets/werewolf-${String(i).padStart(2,'0')}.txt`);
    const encoded = (await Promise.all(chunkUrls.map(async url=>{
      const r = await fetch(url,{cache:'force-cache'});
      if(!r.ok) throw new Error(`Failed to load ${url}`);
      return r.text();
    }))).join('');

    const texture = await new THREE.TextureLoader().loadAsync(`data:image/webp;base64,${encoded}`);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;

    const uniforms = {
      uTexture:{value:texture},
      uTime:{value:0},
      uResolution:{value:new THREE.Vector2(1,1)},
      uImageAspect:{value:texture.image.width/texture.image.height},
      uWind:{value:new THREE.Vector2(0.7,0.12)},
      uMotion:{value:reduceMotion?0.28:1.0}
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      depthTest:false,
      depthWrite:false,
      vertexShader:`
        varying vec2 vUv;
        void main(){vUv=uv;gl_Position=vec4(position,1.0);}
      `,
      fragmentShader:`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uTexture;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uImageAspect;
        uniform vec2 uWind;
        uniform float uMotion;

        float hash21(vec2 p){
          p=fract(p*vec2(123.34,456.21));
          p+=dot(p,p+45.32);
          return fract(p.x*p.y);
        }

        float noise(vec2 p){
          vec2 i=floor(p),f=fract(p);
          f=f*f*(3.0-2.0*f);
          float a=hash21(i),b=hash21(i+vec2(1.,0.)),c=hash21(i+vec2(0.,1.)),d=hash21(i+vec2(1.,1.));
          return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
        }

        float fbm(vec2 p){
          float v=0.0,a=0.5;
          mat2 r=mat2(.80,.60,-.60,.80);
          for(int i=0;i<5;i++){
            v+=a*noise(p);
            p=r*p*2.03+7.13;
            a*=0.5;
          }
          return v;
        }

        float ellipse(vec2 p,vec2 c,vec2 s,float feather){
          vec2 q=(p-c)/s;
          float d=dot(q,q);
          return 1.0-smoothstep(1.0-feather,1.0,d);
        }

        vec2 coverUv(vec2 uv){
          float screenAspect=uResolution.x/max(uResolution.y,1.0);
          vec2 ratio=vec2(1.0);
          if(screenAspect>uImageAspect) ratio.y=uImageAspect/screenAspect;
          else ratio.x=screenAspect/uImageAspect;
          return (uv-.5)*ratio+.5;
        }

        float droplet(vec2 uv,vec2 pos,float size,float stretch){
          vec2 p=(uv-pos)/vec2(size,size*stretch);
          float body=1.0-smoothstep(.28,1.0,dot(p,p));
          float glint=1.0-smoothstep(.02,.18,length(p-vec2(-.18,.25)));
          return body*(.62+.38*glint);
        }

        void main(){
          float t=uTime*uMotion;
          vec2 iuv=coverUv(vUv);

          // The photograph itself is completely static.
          vec3 base=texture2D(uTexture,clamp(iuv,.001,.999)).rgb;
          vec3 col=base;

          // Localized fur layer. Only samples inside conservative wolf masks move.
          float mane=ellipse(iuv,vec2(.505,.735),vec2(.175,.145),.30);
          float shoulderL=ellipse(iuv,vec2(.365,.625),vec2(.105,.135),.34);
          float shoulderR=ellipse(iuv,vec2(.645,.615),vec2(.105,.135),.34);
          float armL=ellipse(iuv,vec2(.315,.505),vec2(.075,.135),.38);
          float armR=ellipse(iuv,vec2(.690,.495),vec2(.075,.135),.38);
          float chest=ellipse(iuv,vec2(.505,.555),vec2(.145,.135),.42);
          float thighL=ellipse(iuv,vec2(.430,.365),vec2(.095,.125),.38);
          float thighR=ellipse(iuv,vec2(.575,.360),vec2(.095,.125),.38);
          float furMask=max(max(max(mane,shoulderL),max(shoulderR,chest)),max(max(armL,armR),max(thighL,thighR)));

          float gust=.55+.45*fbm(vec2(t*.10,3.7));
          vec2 windDir=normalize(vec2(1.0+uWind.x*.28,.16+uWind.y*.10));
          float furWave=sin(iuv.y*118.0+iuv.x*34.0+t*4.1)*.0019;
          furWave+=sin(iuv.y*63.0-iuv.x*19.0+t*2.2)*.0010;
          vec2 furOffset=windDir*furWave*gust;
          furOffset.y+=cos(iuv.x*97.0-t*3.0)*.00055*gust;
          vec3 furMoved=texture2D(uTexture,clamp(iuv+furOffset,.001,.999)).rgb;
          col=mix(col,furMoved,furMask*.88);

          // Tail gets its own slow idle motion rather than moving the whole image.
          float tail=ellipse(iuv,vec2(.220,.355),vec2(.145,.205),.34);
          float tailTip=ellipse(iuv,vec2(.135,.300),vec2(.095,.135),.40);
          float tailSwing=sin(t*.72)*.0085+sin(t*1.21+1.4)*.0025;
          vec2 tailOffset=vec2(tailSwing*(.45+iuv.y),cos(t*.66)*.0018);
          tailOffset+=vec2(sin(t*.72-.55)*.0075,cos(t*.58)*.0022)*tailTip;
          vec3 tailMoved=texture2D(uTexture,clamp(iuv+tailOffset,.001,.999)).rgb;
          col=mix(col,tailMoved,max(tail*.72,tailTip*.82));

          // Moving clouds: independent procedural layer, strongest around the moon.
          vec2 cloudP=vec2(iuv.x*4.0-t*.050,iuv.y*4.8+t*.004);
          float cloudA=fbm(cloudP+vec2(fbm(cloudP*.55),0.0));
          float cloudB=fbm(cloudP*1.55+vec2(9.2,-3.1));
          float cloudDensity=smoothstep(.46,.74,cloudA*.72+cloudB*.28);
          float skyMask=smoothstep(.54,.67,iuv.y);
          float moonMask=ellipse(iuv,vec2(.805,.790),vec2(.165,.145),.55);
          float movingCloud=cloudDensity*skyMask;
          vec3 cloudColor=vec3(.10,.13,.17);
          col=mix(col,cloudColor,movingCloud*(.18+.40*moonMask));

          // A brighter moving cloud edge makes motion readable against moonlight.
          float cloudEdge=smoothstep(.54,.60,cloudA)-smoothstep(.60,.69,cloudA);
          col+=vec3(.09,.11,.14)*cloudEdge*skyMask*(.22+.32*moonMask);

          // Independent rolling fog in the lower terrain.
          vec2 fogP=vec2(iuv.x*3.5-t*.038,iuv.y*7.0+sin(t*.17)*.08);
          float fog1=fbm(fogP+vec2(fbm(fogP*.52),0.0));
          float fog2=fbm(vec2(iuv.x*6.2+t*.026,iuv.y*10.0-t*.006)+4.7);
          float low=1.0-smoothstep(.24,.55,iuv.y);
          float mid=1.0-smoothstep(.42,.66,iuv.y);
          float fog=smoothstep(.44,.72,fog1)*low + smoothstep(.58,.78,fog2)*mid*.38;
          fog=clamp(fog,0.0,1.0);
          vec3 fogColor=vec3(.43,.50,.57);
          col=mix(col,fogColor,fog*.34);

          // Subtle moving specular breakup on fur reinforces wind without moving the scene.
          float hairLight=(.5+.5*sin(iuv.y*92.0+iuv.x*21.0+t*3.7))*furMask*gust;
          col+=vec3(.020,.028,.038)*hairLight;

          // Spittle is generated independently and falls from the fixed mouth position.
          vec2 mouth=vec2(.616,.785);
          float strandX=abs(iuv.x-mouth.x);
          float strandY=smoothstep(mouth.y-.100,mouth.y-.020,iuv.y)*(1.0-smoothstep(mouth.y-.006,mouth.y+.012,iuv.y));
          float strand=(1.0-smoothstep(.0012,.0045,strandX))*strandY;
          float f1=mod(t*.120+.020,.180);
          float f2=mod(t*.092+.090,.220);
          float f3=mod(t*.155+.140,.270);
          float d1=droplet(iuv,mouth+vec2(.004,-.028-f1),.0047,2.1);
          float d2=droplet(iuv,mouth+vec2(-.010,-.043-f2),.0035,1.8);
          float d3=droplet(iuv,mouth+vec2(.014,-.060-f3),.0028,1.6);
          float saliva=max(strand*.55,max(d1,max(d2,d3)));
          col=mix(col,vec3(.84,.91,.95),saliva*.82);
          col+=vec3(.16,.20,.24)*max(d1,max(d2,d3))*.50;

          // Gentle vignette only; no poster frame, no duplicate background.
          vec2 q=vUv-.5;
          float vignette=smoothstep(.86,.28,dot(q,q));
          col*=mix(.76,1.02,vignette);

          gl_FragColor=vec4(col,1.0);
        }
      `
    });

    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

    const targetWind = new THREE.Vector2(.7,.12);
    addEventListener('pointermove',e=>{
      targetWind.x=((e.clientX/window.innerWidth)-.5)*2.0;
      targetWind.y=-(((e.clientY/window.innerHeight)-.5)*2.0)*.35;
    },{passive:true});
    addEventListener('pointerleave',()=>targetWind.set(.7,.12),{passive:true});

    function resize(){
      const vv=window.visualViewport;
      const w=Math.max(1,Math.round(vv?.width||window.innerWidth));
      const h=Math.max(1,Math.round(vv?.height||window.innerHeight));
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      renderer.setSize(w,h,false);
      uniforms.uResolution.value.set(w,h);
    }
    resize();
    addEventListener('resize',resize,{passive:true});
    window.visualViewport?.addEventListener('resize',resize,{passive:true});
    window.visualViewport?.addEventListener('scroll',resize,{passive:true});

    const clock=new THREE.Clock();
    function animate(){
      uniforms.uTime.value=clock.getElapsedTime();
      uniforms.uWind.value.lerp(targetWind,.018);
      renderer.render(scene,camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
