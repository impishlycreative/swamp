name: Apply game-specific desktop writing-game layouts

on:
  push:
    paths:
      - '.github/workflows/desktop-layout.yml'

permissions:
  contents: write

jobs:
  update-layouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build each game as its own desktop workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = '''
          @media (min-width:900px){
            main{max-width:1280px;padding:28px 32px}
            .hero,.panel{padding:24px 28px}
            .hero p{max-width:82ch}
            .controls{align-items:center}
            .box,.char,.shared,.collision,.active{min-width:0}
          }
          '''

          # Explicit per-game desktop arrangements. These are deliberately not one
          # generic page grid: the layout follows what the player needs to see together.
          layouts = {
          'ambush': '''@media (min-width:1100px){main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);gap:18px;align-items:start}main>.hero{grid-column:1/-1;margin:0}main>.panel{margin:0}main>.panel:nth-of-type(2){grid-column:1;grid-row:2}main>.panel:nth-of-type(3){grid-column:1;grid-row:3}main>.panel:nth-of-type(4){grid-column:2;grid-row:2/4}main>.panel:nth-of-type(5){grid-column:1/-1;grid-row:4}main>.panel:nth-of-type(6){grid-column:1/-1;grid-row:5}.timerCircle{width:220px}.ambush{text-align:center}}''',
          'cause_effect': '''@media (min-width:1100px){main>.panel:nth-of-type(2){padding:28px 32px}.chain{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:6px}.chain .node{min-width:220px;flex:1}.chain .arrow{display:grid;place-items:center;min-width:88px;font-size:1rem}.prompt{font-size:1.3rem}main>.panel:nth-of-type(3){display:grid;grid-template-columns:1fr 1fr;column-gap:32px}main>.panel:nth-of-type(3)>h2{grid-column:1/-1}}''',
          'character_collision': '''@media (min-width:1100px){main>.panel:nth-of-type(2)>.grid{grid-template-columns:1fr 1fr;gap:20px}.shared,.active,.collision{display:inline-block;vertical-align:top;width:calc(33.333% - 11px);margin-right:12px;min-height:170px}.collision{margin-right:0}main>.panel:nth-of-type(3){display:grid;grid-template-columns:1fr 1fr;column-gap:32px}main>.panel:nth-of-type(3)>h2{grid-column:1/-1}}''',
          'character_filter': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:22px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}''',
          'choice_cost': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'constraint': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'escalation': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}''',
          'foreshadow_seed': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'goal_under_pressure': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'hidden_motive': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'limited_resources': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(300px,.7fr) minmax(0,1.3fr);gap:22px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}''',
          'pacing_pulse': '''@media (min-width:1100px){main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);gap:18px;align-items:start}main>.hero{grid-column:1/-1;margin:0}main>.panel{margin:0}main>.panel:nth-of-type(2){grid-column:1;grid-row:2/4}main>.panel:nth-of-type(3){grid-column:2;grid-row:2}main>.panel:nth-of-type(4){grid-column:2;grid-row:3}.timerWrap{margin:12px 0}}''',
          'pov_shift': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'reveal_reframe': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'revelation': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'scene_compression': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:22px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'sensory_lens': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(300px,.75fr) minmax(0,1.25fr);gap:22px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'story_pressure': '''@media (min-width:1100px){main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);gap:18px;align-items:start}main>.hero{grid-column:1/-1;margin:0}main>.panel{margin:0}main>.panel:nth-of-type(2){grid-column:1;grid-row:2/4}main>.panel:nth-of-type(3){grid-column:2;grid-row:2}main>.panel:nth-of-type(4){grid-column:2;grid-row:3}}''',
          'subtext_signal': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''',
          'worst_possible_choice': '''@media (min-width:1100px){main>.panel:nth-of-type(2){display:grid;grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr);gap:22px;align-items:start}main>.panel:nth-of-type(2)>h2,main>.panel:nth-of-type(2)>.controls{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}'''
          }

          # Remove the previous generic injected block, preserving each game's mobile CSS.
          generic = re.compile(r'/\* desktop-workspace-v1 \*/.*?(?=@media\s*\(max-width:)', re.S)
          generic2 = re.compile(r'/\* desktop-game-layout-v2:[^*]+\*/.*?(?=@media\s*\(max-width:)', re.S)
          changed=[]
          for path in sorted(Path('writing_games').glob('*/game_index.html')):
              slug=path.parent.name
              text=path.read_text(encoding='utf-8')
              original=text
              text=generic.sub('',text)
              text=generic2.sub('',text)
              text=re.sub(r'main\{max-width:\d+px;', 'main{max-width:1280px;', text, count=1)
              css=base+layouts.get(slug, '''@media (min-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}''')
              marker=re.search(r'@media\s*\(max-width:',text)
              pos=marker.start() if marker else text.find('</style>')
              block=f'/* desktop-game-layout-v2:{slug} */\n'+css+'\n'
              text=text[:pos]+block+text[pos:]
              if text!=original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(slug)
          print('game-specific desktop layouts:', ', '.join(changed))
          PY
      - name: Commit game-specific layouts and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing_games/*/game_index.html
          git rm .github/workflows/desktop-layout.yml
          git commit -m "Redesign writing games for desktop by game mechanics"
          git push origin HEAD:master
