<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <title>Wolf — WebGL Werewolf</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
    body{min-height:100dvh}
    #stage{position:fixed;inset:0;background:#05070a}
    #base,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
    #base{object-fit:contain;object-position:center center;user-select:none;-webkit-user-drag:none}
    #fx{pointer-events:none}
    #status{position:fixed;left:12px;bottom:12px;z-index:5;padding:7px 9px;border-radius:8px;background:rgba(0,0,0,.45);color:#cfd7df;font:11px/1.2 system-ui,sans-serif;opacity:.55}
  </style>
</head>
<body>
  <div id="stage">
    <img id="base" alt="Moonlit werewolf" />
    <canvas id="fx" aria-hidden="true"></canvas>
  </div>
  <div id="status">Static artwork · independent WebGL clouds, fog and spittle</div>

  <script>
  (async()=>{
    const img=document.getElementById('base');
    const canvas=document.getElementById('fx');
    const chunks=Array.from({length:6},(_,i)=>`./assets/werewolf-${String(i).padStart(2,'0')}.txt`);
    const encoded=(await Promise.all(chunks.map(async u=>{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error(`Failed ${u}`);return r.text();}))).join('');
    img.src=`data:image/webp;base64,${encoded}`;
    await img.decode();

    const gl=canvas.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:false});
    if(!gl){document.getElementById('status').textContent='WebGL 2 unavailable';return;}

    const vs=`#version 300 es
      precision highp float;
      out vec2 vUv;
      const vec2 P[3]=vec2[](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));
      void main(){vec2 p=P[gl_VertexID];vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;

    const fs=`#version 300 es
      precision highp float;
      in vec2 vUv;
      out vec4 outColor;
      uniform vec2 uResolution;
      uniform vec2 uImageOffset;
      uniform vec2 uImageSize;
      uniform float uTime;

      float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
      float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=mat2(.8,.6,-.6,.8)*p*2.03+7.13;a*=.5;}return v;}
      float ell(vec2 p,vec2 c,vec2 s){vec2 q=(p-c)/s;return 1.-smoothstep(.72,1.,dot(q,q));}
      float drop(vec2 p,vec2 c,float s,float stretch){vec2 q=(p-c)/vec2(s,s*stretch);float b=1.-smoothstep(.28,1.,dot(q,q));float g=1.-smoothstep(.03,.20,length(q-vec2(-.18,.25)));return b*(.58+.42*g);}

      void main(){
        vec2 px=vUv*uResolution;
        vec2 uv=(px-uImageOffset)/uImageSize;
        bool inside=uv.x>=0.&&uv.x<=1.&&uv.y>=0.&&uv.y<=1.;
        if(!inside){outColor=vec4(0.);return;}

        float t=uTime;
        vec3 rgb=vec3(0.);
        float a=0.;

        // Independent clouds, strongest as they cross the moon.
        vec2 cp=vec2(uv.x*4.2-t*.035,uv.y*5.0+t*.004);
        float c1=fbm(cp+vec2(fbm(cp*.55),0.));
        float c2=fbm(cp*1.65+vec2(7.1,-2.8));
        float cloud=smoothstep(.48,.73,c1*.72+c2*.28);
        float sky=smoothstep(.58,.72,uv.y);
        float moon=ell(uv,vec2(.83,.82),vec2(.16,.15));
        float cloudAlpha=cloud*sky*(.10+.32*moon);
        rgb+=vec3(.075,.095,.125)*cloudAlpha;
        a=max(a,cloudAlpha);

        float edge=(smoothstep(.50,.58,c1)-smoothstep(.58,.67,c1))*sky*(.07+.22*moon);
        rgb+=vec3(.18,.21,.25)*edge;
        a=max(a,edge);

        // Independent low rolling fog.
        vec2 fp=vec2(uv.x*3.6-t*.022,uv.y*7.2+sin(t*.16)*.06);
        float f1=fbm(fp+vec2(fbm(fp*.5),0.));
        float f2=fbm(vec2(uv.x*6.5+t*.018,uv.y*10.5)+4.3);
        float low=1.-smoothstep(.18,.54,uv.y);
        float fog=clamp(smoothstep(.45,.72,f1)*low + smoothstep(.60,.79,f2)*low*.28,0.,1.);
        float fogAlpha=fog*.22;
        rgb=mix(rgb,vec3(.42,.49,.56),fogAlpha);
        a=max(a,fogAlpha);

        // Real independent saliva particles; no source-image displacement.
        vec2 mouth=vec2(.616,.785);
        float sx=abs(uv.x-mouth.x);
        float sy=smoothstep(mouth.y-.102,mouth.y-.020,uv.y)*(1.-smoothstep(mouth.y-.007,mouth.y+.010,uv.y));
        float strand=(1.-smoothstep(.0012,.0042,sx))*sy*.55;
        float q1=mod(t*.115+.01,.18),q2=mod(t*.087+.08,.22),q3=mod(t*.147+.13,.27);
        float d1=drop(uv,mouth+vec2(.004,-.028-q1),.0046,2.1);
        float d2=drop(uv,mouth+vec2(-.010,-.043-q2),.0035,1.8);
        float d3=drop(uv,mouth+vec2(.014,-.060-q3),.0028,1.6);
        float saliva=max(strand,max(d1,max(d2,d3)));
        if(saliva>0.){
          vec3 sCol=vec3(.86,.92,.96)*(saliva*.88);
          rgb=max(rgb,sCol);
          a=max(a,saliva*.88);
        }

        outColor=vec4(rgb,a);
      }`;

    function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
    const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);gl.bindVertexArray(gl.createVertexArray());gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    const locRes=gl.getUniformLocation(prog,'uResolution'),locOff=gl.getUniformLocation(prog,'uImageOffset'),locSize=gl.getUniformLocation(prog,'uImageSize'),locTime=gl.getUniformLocation(prog,'uTime');

    function resize(){
      const vv=window.visualViewport;const cssW=Math.max(1,Math.round(vv?.width||innerWidth));const cssH=Math.max(1,Math.round(vv?.height||innerHeight));const dpr=Math.min(devicePixelRatio||1,2);
      canvas.style.width=`${cssW}px`;canvas.style.height=`${cssH}px`;canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);gl.viewport(0,0,canvas.width,canvas.height);
      const s=Math.min(cssW/img.naturalWidth,cssH/img.naturalHeight);const iw=img.naturalWidth*s,ih=img.naturalHeight*s;const ox=(cssW-iw)/2,oy=(cssH-ih)/2;
      gl.uniform2f(locRes,cssW,cssH);gl.uniform2f(locOff,ox,oy);gl.uniform2f(locSize,iw,ih);
    }
    resize();addEventListener('resize',resize,{passive:true});window.visualViewport?.addEventListener('resize',resize,{passive:true});

    const start=performance.now();
    function frame(now){gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(prog);gl.uniform1f(locTime,(now-start)/1000);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame);}requestAnimationFrame(frame);
  })().catch(err=>{console.error(err);document.getElementById('status').textContent='Scene failed to load';});
  </script>
</body>
</html>
